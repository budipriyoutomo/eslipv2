; E-Slip v2 queue worker — copy to /etc/supervisor/conf.d/eslip-worker.conf
; then: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start eslip-worker:*
;
; Adjust the paths and user. After every deploy run: php artisan queue:restart
;
; One process is enough: sending is throttled per SMTP account (ESLIP_MAIL_PER_MINUTE),
; more workers would only wait on the rate limiter.

[program:eslip-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/eslip/artisan queue:work database --queue=payslips,default --sleep=3 --max-time=3600 --memory=256
directory=/var/www/eslip
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Longer than SendPayslipJob::$timeout (120 s) so a job can finish during shutdown.
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/www/eslip/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
