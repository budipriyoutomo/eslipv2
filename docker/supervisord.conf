[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Sends payslips. One process is enough: sending is throttled per SMTP account.
[program:worker]
command=php /var/www/html/artisan queue:work database --queue=payslips,default --sleep=3 --max-time=3600 --memory=256
user=www-data
autorestart=true
; Longer than SendPayslipJob::$timeout (120 s) so a running send can finish on shutdown.
stopwaitsecs=150
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Cleanup of temporary PDFs and queue pruning (routes/console.php).
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
