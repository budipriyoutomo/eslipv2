; E-Slip: upload limit must exceed StorePayslipBatchRequest::MAX_FILE_KILOBYTES (10 MB).
upload_max_filesize = 12M
post_max_size = 16M
; PhpSpreadsheet + TCPDF on large Excel files.
memory_limit = 512M
max_execution_time = 120
expose_php = Off
date.timezone = Asia/Jakarta

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
