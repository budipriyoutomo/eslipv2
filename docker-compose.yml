# E-Slip v2 — production, satu container (nginx + php-fpm + queue worker + scheduler).
#
# PostgreSQL memakai container `maharasa-postgres` yang sudah ada, lewat network `posgresql_default`.
# Migrasi database jalan otomatis setiap container start.
#
#   cp .env.docker.example .env.docker      # isi APP_KEY, DB_*, SMTP
#   docker compose up -d --build
#   docker compose exec app php artisan eslip:create-user superadmin
#
# Lihat docs/deploy/DOCKER.md.

name: eslipv2

services:
  app:
    build: .
    image: eslipv2:latest
    container_name: eslipv2
    restart: unless-stopped
    env_file: .env.docker
    ports:
      # 8000-8003 dan 8080 sudah dipakai container lain di server ini.
      - "8004:80"
    volumes:
      - storage:/var/www/html/storage
    # Satu network dengan maharasa-postgres → DB_HOST=maharasa-postgres.
    networks:
      - postgres
    # Untuk menjangkau port host, mis. MySQL lama :3308 (eslip:import-legacy).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Lebih lama dari stopwaitsecs worker (150 s) supaya email yang sedang dikirim selesai.
    stop_grace_period: 160s

networks:
  # Network milik container maharasa-postgres (dibuat oleh compose Postgres, bukan oleh file ini).
  postgres:
    name: posgresql_default
    external: true

volumes:
  storage:
